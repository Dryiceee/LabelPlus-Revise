<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">监修与嵌字的返修分工</title>
<desc id="desc">蓝色人物是监修者，红色人物是嵌字者。传统流程由监修通过QQ发送截图，在聊天消息中说明问题，嵌字逐条查看、定位和修改。使用工具时，监修在成品图标注并导出revise.txt，嵌字批量导入PSD并对照revise图层修改。</desc>
